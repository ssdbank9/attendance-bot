# AKU Attendance Bot - runs on a self-hosted runner (aku-desktop)
#
# This workflow calls timein_bot.py directly on the runner machine, so all
# scheduling logic (weekends, holidays, blackout days, pause state, retry/
# fallback) lives in one place: timein_bot.py itself.
#
# The AKU API (portalservice.aku.edu) is a private-network address and is
# NOT reachable from GitHub-hosted cloud runners - that's why this workflow
# requires the self-hosted runner registered on the AKU-network desktop.

name: Attendance Bot

on:
  schedule:
    # Time-In window start: 8:45 AM PKT = 3:45 AM UTC (Mon-Fri)
    - cron: '45 3 * * 1-5'
    # Time-Out window start: 8:00 PM PKT = 3:00 PM UTC (Mon-Fri)
    - cron: '0 15 * * 1-5'
  workflow_dispatch:
    inputs:
      action:
        description: 'Force action (timein/timeout), or leave as auto'
        required: false
        default: 'auto'

jobs:
  mark-attendance:
    runs-on: [self-hosted, windows]
    steps:
      - name: Determine action
        id: action
        shell: bash
        run: |
          INPUT_ACTION="${{ github.event.inputs.action }}"
          if [ -n "$INPUT_ACTION" ] && [ "$INPUT_ACTION" != "auto" ]; then
            echo "mode=$INPUT_ACTION" >> "$GITHUB_OUTPUT"
            echo "now_flag=--now" >> "$GITHUB_OUTPUT"
          else
            HOUR=$(TZ='Asia/Karachi' date +%H)
            if [ "$HOUR" -lt 12 ]; then
              echo "mode=timein" >> "$GITHUB_OUTPUT"
            else
              echo "mode=timeout" >> "$GITHUB_OUTPUT"
            fi
            echo "now_flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Mark attendance
        shell: bash
        run: |
          python "D:/DropBox/Self/Claude/Attendance Management/timein_bot.py" ${{ steps.action.outputs.mode }} ${{ steps.action.outputs.now_flag }}
