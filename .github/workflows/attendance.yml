# AKU Attendance Bot - runs on a self-hosted runner (aku-desktop)
#
# This workflow calls timein_bot.py directly on the runner machine, so all
# scheduling logic (weekends, holidays, blackout days, pause state, retry/
# fallback) lives in one place: timein_bot.py itself.
#
# The AKU API (portalservice.aku.edu) is a private-network address and is
# NOT reachable from GitHub-hosted cloud runners - that's why this workflow
# requires the self-hosted runner registered on the AKU-network desktop.
#
# Steps use PowerShell (not bash) - on this Windows runner, `shell: bash`
# resolves to the WSL stub at C:\WINDOWS\system32\bash.EXE, not Git Bash,
# and fails if no WSL distro is installed.
#
# Attendance and portal credentials remain on the self-hosted machine. This
# workflow does not accept, store, or apply them through GitHub.
#
# HIERARCHY: local bot first, this (self-hosted runner) second as a backup,
# Google Apps Script last. This fires right as the local Task Scheduler
# job's own window closes and runs with --fallback, which picks its own
# random time within [window_end, window_end + 10min] before checking -
# so it only ever does anything if the local bot didn't already get
# there first, and doesn't fire at a suspiciously exact instant every
# day either. Keep these cron times in sync with config.json's
# timein/timeout window_end if you change the windows.

name: Attendance Bot

on:
  schedule:
    # Time-In fallback: 9:05 AM PKT = 4:05 AM UTC (Mon-Fri) - right at the
    # local bot's own window close (window_end)
    - cron: '5 4 * * 1-5'
    # Time-Out fallback: 9:30 PM PKT = 4:30 PM UTC (Mon-Fri) - right at the
    # local bot's own window close (window_end)
    - cron: '30 16 * * 1-5'
  workflow_dispatch:
    inputs:
      action:
        description: 'Force action (timein/timeout/pause/resume/update-windows), or leave as auto'
        required: false
        default: 'auto'
      ti_start:
        description: 'Time-In window start HH:MM (action=update-windows only)'
        required: false
      ti_end:
        description: 'Time-In window end HH:MM (action=update-windows only)'
        required: false
      to_start:
        description: 'Time-Out window start HH:MM (action=update-windows only)'
        required: false
      to_end:
        description: 'Time-Out window end HH:MM (action=update-windows only)'
        required: false

jobs:
  mark-attendance:
    runs-on: [self-hosted, windows]
    steps:
      - name: Determine action
        id: action
        shell: powershell
        run: |
          $inputAction = "${{ github.event.inputs.action }}"
          if ($inputAction -and $inputAction -ne "auto") {
            $mode = $inputAction
            $runFlag = "--now"
          } else {
            $hour = [int](Get-Date -Format "HH")
            if ($hour -lt 12) { $mode = "timein" } else { $mode = "timeout" }
            $runFlag = "--fallback"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "mode=$mode"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "run_flag=$runFlag"

      - name: Mark attendance
        shell: powershell
        env:
          TI_START: ${{ github.event.inputs.ti_start }}
          TI_END: ${{ github.event.inputs.ti_end }}
          TO_START: ${{ github.event.inputs.to_start }}
          TO_END: ${{ github.event.inputs.to_end }}
        run: |
          $mode = "${{ steps.action.outputs.mode }}"
          $base = "D:/DropBox/Self/Claude/Attendance Management"
          if ($mode -eq "pause") {
            python "$base/set_pause.py" true
          } elseif ($mode -eq "resume") {
            python "$base/set_pause.py" false
          } elseif ($mode -eq "update-windows") {
            python "$base/apply_windows.py"
          } else {
            python "$base/timein_bot.py" $mode ${{ steps.action.outputs.run_flag }}
          }
